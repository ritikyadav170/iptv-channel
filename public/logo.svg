<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90" fill="none">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="brandGrad" x1="0" y1="0" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2E55"/>
      <stop offset="50%" stop-color="#FF5B22"/>
      <stop offset="100%" stop-color="#FFA800"/>
    </linearGradient>

    <linearGradient id="tvBg" x1="0" y1="0" x2="0" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141B2D"/>
      <stop offset="100%" stop-color="#090D18"/>
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FF2E55" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Left: Icon Mark -->
  <g transform="translate(5, 5)">
    <!-- TV Outer Monitor Box -->
    <rect x="5" y="10" width="70" height="54" rx="16" fill="url(#tvBg)" stroke="url(#brandGrad)" stroke-width="2.5" filter="url(#logoGlow)"/>

    <!-- Antenna horns -->
    <path d="M28 2 L40 10 L52 2" stroke="url(#brandGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="40" cy="10" r="2.5" fill="#FF5B22"/>

    <!-- Play Symbol / Iris inside Screen -->
    <path d="M35 27 C35 25.2, 37.1 24.1, 38.6 25.1 L51 33.5 C52.4 34.4, 52.4 36.6, 51 37.5 L38.6 45.9 C37.1 46.9, 35 45.8, 35 44 Z" fill="url(#brandGrad)"/>

    <!-- TV Stand -->
    <path d="M30 68 L50 68" stroke="url(#brandGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M37 64 L34 68 M43 64 L46 68" stroke="url(#brandGrad)" stroke-width="2" stroke-linecap="round"/>

    <!-- Live indicator dot -->
    <circle cx="66" cy="18" r="3" fill="#00E676"/>
    <circle cx="66" cy="18" r="5" stroke="#00E676" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Right: Typography "Dekho TV" -->
  <g transform="translate(96, 12)">
    <!-- "Dekho" Text -->
    <text x="0" y="44" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="900" font-size="40" fill="#FFFFFF" letter-spacing="-0.5">
      Dekho
    </text>

    <!-- "TV" Pill Badge -->
    <g transform="translate(136, 10)">
      <rect x="0" y="0" width="56" height="40" rx="12" fill="url(#brandGrad)" filter="url(#logoGlow)"/>
      <text x="28" y="28" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" letter-spacing="0.5">
        TV
      </text>
    </g>

    <!-- Subtitle -->
    <text x="2" y="62" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="9.5" fill="#94A3B8" letter-spacing="2.5">
      FREE LIVE STREAMING
    </text>
  </g>
</svg>
