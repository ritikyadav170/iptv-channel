<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240" fill="none">
  <defs>
    <linearGradient id="pogoBg" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <rect width="400" height="240" rx="16" fill="url(#pogoBg)"/>
  <rect width="398" height="238" x="1" y="1" rx="15" stroke="#334155" stroke-width="1.5"/>

  <!-- Pogo 4-Block Letters -->
  <!-- Block P (Yellow) -->
  <g filter="url(#shadow)">
    <rect x="52" y="60" width="68" height="78" rx="14" fill="#FBBF24"/>
    <text x="86" y="121" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="52" fill="#1E1B4B">P</text>
  </g>

  <!-- Block O (Green) -->
  <g filter="url(#shadow)">
    <rect x="128" y="60" width="68" height="78" rx="14" fill="#10B981"/>
    <text x="162" y="121" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF">O</text>
  </g>

  <!-- Block G (Red) -->
  <g filter="url(#shadow)">
    <rect x="204" y="60" width="68" height="78" rx="14" fill="#EF4444"/>
    <text x="238" y="121" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF">G</text>
  </g>

  <!-- Block O (Cyan/Blue) -->
  <g filter="url(#shadow)">
    <rect x="280" y="60" width="68" height="78" rx="14" fill="#0EA5E9"/>
    <text x="314" y="121" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF">O</text>
  </g>

  <!-- Subtitle Badge -->
  <rect x="110" y="156" width="180" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <circle cx="126" cy="170" r="4" fill="#FBBF24"/>
  <text x="204" y="175" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="12" fill="#F1F5F9" letter-spacing="2.5">POGO • KIDS</text>
</svg>

