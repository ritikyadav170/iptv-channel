<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" rx="16" fill="url(#bgGrad)"/>
  <rect width="398" height="238" x="1" y="1" rx="15" stroke="#334155" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Glow effect -->
  <circle cx="200" cy="100" r="80" fill="url(#glow)"/>

  <!-- TV Icon -->
  <g transform="translate(164, 52)">
    <!-- Antennas -->
    <path d="M20 20 L8 6" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M52 20 L64 6" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <!-- Screen body -->
    <rect x="0" y="20" width="72" height="52" rx="8" fill="#1e293b" stroke="#e2e8f0" stroke-width="3"/>
    <!-- Inner screen -->
    <rect x="6" y="26" width="60" height="40" rx="4" fill="#0f172a"/>
    <!-- Play symbol -->
    <polygon points="32,38 32,54 46,46" fill="url(#accentGrad)"/>
    <!-- Live dot -->
    <circle cx="60" cy="32" r="3" fill="#ef4444"/>
  </g>

  <!-- Channel Text -->
  <text x="200" y="160" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#f8fafc" letter-spacing="0.5">
    LIVE TV
  </text>
  <text x="200" y="184" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#94a3b8" letter-spacing="1.5">
    BROADCAST NETWORK
  </text>
</svg>

