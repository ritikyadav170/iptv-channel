<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="dekhoBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1322"/>
      <stop offset="50%" stop-color="#070911"/>
      <stop offset="100%" stop-color="#040508"/>
    </linearGradient>

    <linearGradient id="dekhoAccent" x1="60" y1="60" x2="452" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2E55"/>
      <stop offset="50%" stop-color="#FF5B22"/>
      <stop offset="100%" stop-color="#FFA800"/>
    </linearGradient>

    <linearGradient id="screenFill" x1="0" y1="120" x2="0" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#182033"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#FF2E55" flood-opacity="0.45"/>
    </filter>

    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FFA800" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Rounded Superellipse / App Icon Frame -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#dekhoBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="url(#dekhoAccent)" stroke-width="6" stroke-opacity="0.5"/>

  <!-- TV Antenna / Modern Broadcast Horns (Subtle, sleek) -->
  <path d="M190 85 L256 130 L322 85" stroke="url(#dekhoAccent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <circle cx="256" cy="130" r="10" fill="#FF5B22"/>

  <!-- TV Screen Monitor Frame -->
  <rect x="76" y="130" width="360" height="260" rx="36" fill="url(#screenFill)" stroke="url(#dekhoAccent)" stroke-width="8" filter="url(#glow)"/>

  <!-- TV Screen Bezel Specular Highlight -->
  <path d="M96 150 C96 150, 160 145, 256 145 C352 145, 416 150, 416 150" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.25"/>

  <!-- Iconic DEKHO Play Triangle / Broadcast Eye Iris -->
  <g filter="url(#innerGlow)">
    <path d="M220 200 C220 190.5, 230.5 184.8, 238.5 190 L318 245 C325.5 249.5, 325.5 260.5, 318 265 L238.5 320 C230.5 325.2, 220 319.5, 220 310 Z" fill="url(#dekhoAccent)"/>
  </g>

  <!-- TV Stand Base / Foot -->
  <path d="M200 422 L312 422" stroke="url(#dekhoAccent)" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  <path d="M236 390 L220 422 M276 390 L292 422" stroke="url(#dekhoAccent)" stroke-width="8" stroke-linecap="round" opacity="0.7"/>

  <!-- Live Pulsing Indicator Dot on TV Frame -->
  <circle cx="396" cy="165" r="9" fill="#00E676"/>
  <circle cx="396" cy="165" r="16" stroke="#00E676" stroke-width="3" opacity="0.4"/>
</svg>
